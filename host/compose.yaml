name: flutter-cicd

services:
  flutter-ci:
    profiles: ["tools"]
    image: flutter-ci:1.0
    platform: linux/amd64
    build:
      context: ./flutter
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.0}
        ANDROID_CMDLINE_TOOLS_VERSION: ${ANDROID_CMDLINE_TOOLS_VERSION:-15859902}

  jenkins:
    image: flutter-cicd-jenkins:1.0
    platform: linux/amd64
    build:
      context: ./jenkins
      args:
        JENKINS_BASE_IMAGE: ${JENKINS_BASE_IMAGE:-jenkins/jenkins:2.568.3-jdk21}
    container_name: jenkins
    # Matches the root Flutter build containers' workspace ownership.
    # This POC runs trusted builds on the built-in node.
    user: "0:0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Djava.awt.headless=true -Xms256m -Xmx1g"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jenkins_home:
